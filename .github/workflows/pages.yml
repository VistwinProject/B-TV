# 把 TV 主顯示建置成 GitHub Pages 靜態站台(給遠端看畫面 / 對外 demo 用)。
#
# 注意:Pages 站台沒有 NFC server(ws://localhost:8788),所以感應卡不會有反應,
# 右下角狀態燈會停在「連線中」。用鍵盤操作即可:i 前言 · c 房屋資訊 · 1-5 情境 ·
# o 結語 · r 重置 · e 編輯面板。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署,但不中斷進行中的那個(避免半途中斷留下壞站台)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build (base = /B-TV/)
        run: npm run build
        env:
          PAGES_BASE: /B-TV/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
